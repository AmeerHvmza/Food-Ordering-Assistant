<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Foodpanda Local Browse{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">Local Menu Browser</a>
      <p class="tagline">Scraped Foodpanda data · SQLite</p>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer wrap">
    <p>Data from <code>foodpanda.db</code> · Run <code>python main.py --fresh --top-rated=True</code> to refresh</p>
  </footer>
</body>
</html>
