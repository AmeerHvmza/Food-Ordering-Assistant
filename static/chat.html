<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Food Ordering Assistant</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f8f9fb;
    --border: #d5d9e0;
    --text: #111827;
    --muted: #4b5563;
    --accent: #e21b70;
    --accent-soft: #fde8f1;
    --ok: #059669;
    --star: #c98900;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: min(1120px, 100%);
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    padding: 16px;
    height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
  .chat, .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--accent); }
  .banner {
    padding: 8px 18px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid #f5b6ce; color: var(--text); }
  .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  .msg.err { align-self: center; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 13px; }
  .msg.busy {
    align-self: center;
    max-width: 90%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }
  .cards {
    align-self: stretch;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    padding: 0;
    color: inherit;
    width: 100%;
    font: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card img, .card .ph {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    background: #eef0f4;
  }
  .card .ph {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .card .body { padding: 10px 12px 12px; }
  .card .name { font-weight: 650; font-size: 14px; line-height: 1.3; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card .row { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; }
  .star { color: var(--star); font-weight: 700; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; background: var(--accent); color: #fff;
    border-radius: 4px; padding: 2px 6px; margin-bottom: 6px;
  }
  .price { font-weight: 700; color: var(--text); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 11px 18px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
  header button.ghost { padding: 6px 10px; font-size: 12px; }
  button.mic {
    padding: 11px 14px; min-width: 52px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); font-weight: 600;
    touch-action: none; user-select: none;
  }
  button.mic.recording { background: #b91c1c; color: #fff; border-color: #b91c1c; }
  button.muted { border-color: var(--accent); color: var(--accent); }
  .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .sidebar .body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { text-align: right; }
  .line {
    display: grid; grid-template-columns: 48px 1fr auto; gap: 8px;
    align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .line img, .line .ph {
    width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #eef0f4;
  }
  .line .ph { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
  .totals { font-size: 13px; margin-top: 8px; }
  .totals .kv.pay { font-weight: 700; font-size: 15px; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 6px; }
  .fee-note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="chat">
    <header>
      <span class="dot" id="health"></span>
      <h1>Food Ordering Assistant</h1>
      <span style="margin-left:auto;color:var(--muted);font-size:12px" id="model">checking…</span>
      <button class="ghost" id="stop-speech" type="button" title="Stop speaking">Stop</button>
      <button class="ghost" id="mute" type="button" title="Skip text-to-speech">Mute</button>
    </header>
    <div class="banner">
      Karachi snapshot only. Ask for your area first — Foodpanda does not list
      restaurants that are too far away. Does not place real orders.
    </div>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="e.g. Saddar — 5 of us, burgers and pizza" />
      <button id="mic" class="mic" type="button" title="Click to talk">Mic</button>
      <button id="send" type="submit">Send</button>
    </form>
    <audio id="tts" preload="auto"></audio>
  </div>

  <aside class="sidebar">
    <header><h2>Your cart</h2></header>
    <div class="body">
      <div id="prefs"></div>
      <div>
        <h2>Items</h2>
        <div id="cart" style="margin-top:8px;color:var(--muted);font-size:13px">Empty</div>
      </div>
    </div>
    <footer>
      <button class="ghost" id="confirm" type="button">Confirm</button>
      <button class="ghost" id="reset" type="button">New session</button>
    </footer>
  </aside>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const muteBtn = document.getElementById('mute');
const stopBtn = document.getElementById('stop-speech');
const speechEl = document.getElementById('tts');
const SILENCE_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

let sessionId = newSessionId();
let lastShowcaseKey = '';
let speechMuted = false;
let speakGen = 0;
let currentAudio = null;
let speechUnlocked = false;
let ttsFallbackNoted = false;
let mediaRecorder = null;
let recordChunks = [];
let recording = false;
let transcribing = false;
let recordStartedAt = 0;
let activeStream = null;
let recorderMime = '';
let liveTimer = null;
let liveKick = null;
let liveSeq = 0;
let liveInFlight = false;
let liveDirty = false;

function newSessionId() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    ('sess-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}

// Replaced server-side when DEMO_MODE=1, so the local demo works without
// anyone pasting a key. Left as the literal placeholder otherwise.
const DEMO_KEY = "__DEMO_API_KEY__";
const API_BASE = '/v1';
let apiKey = resolveApiKey();

function resolveApiKey() {
  if (DEMO_KEY && DEMO_KEY.indexOf('DEMO_API_KEY') === -1) return DEMO_KEY;
  let stored = (localStorage.getItem('fd_api_key') || '').trim();
  if (!stored) {
    stored = (window.prompt(
      'API key required.\n\nCreate one with:\n' +
      '  python -m auth.manage create-tenant "local" --tier unlimited\n' +
      '  python -m auth.manage create-key 1'
    ) || '').trim();
    if (stored) localStorage.setItem('fd_api_key', stored);
  }
  return stored;
}

// Every authenticated call goes through here, so the version prefix and the
// key live in exactly one place.
function api(path, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {});
  if (apiKey) opts.headers['Authorization'] = 'Bearer ' + apiKey;
  return fetch(API_BASE + path, opts).then(res => {
    if (res.status === 401) {
      localStorage.removeItem('fd_api_key');
      apiKey = '';
    }
    return res;
  });
}

function apiErrorText(res, data) {
  if (res.status === 401) {
    return 'API key rejected. Reload the page to enter a new one.';
  }
  if (res.status === 429) {
    const retry = res.headers.get('Retry-After');
    return 'Rate limit reached.' + (retry ? ' Try again in ' + retry + 's.' : '');
  }
  return (data && data.detail) || ('Request failed (' + res.status + ')');
}

function addMessage(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function money(n) {
  return (typeof n === 'number')
    ? 'Rs. ' + n.toLocaleString(undefined, {maximumFractionDigits: 2})
    : '—';
}

function imgOrPh(url, cls) {
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.replaceWith(ph()); };
    return img;
  }
  return ph();
  function ph() {
    const d = document.createElement('div');
    d.className = cls || 'ph';
    d.textContent = 'No photo';
    return d;
  }
}

function renderShowcase(showcase) {
  if (!showcase || !showcase.items || !showcase.items.length) return;
  const key = JSON.stringify(showcase.items.map(i => [i.kind, i.id]));
  if (key === lastShowcaseKey) return;
  lastShowcaseKey = key;

  const wrap = document.createElement('div');
  wrap.className = 'cards';
  for (const item of showcase.items) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    const body = document.createElement('div');
    body.className = 'body';
    if (item.badge) {
      const b = document.createElement('div');
      b.className = 'badge';
      b.textContent = item.badge;
      body.appendChild(b);
    }
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name || 'Untitled';
    body.appendChild(name);
    if (item.subtitle) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = item.subtitle;
      body.appendChild(meta);
    }
    const row = document.createElement('div');
    row.className = 'row';
    if (item.kind === 'restaurant') {
      const left = document.createElement('span');
      left.className = 'star';
      const reviews = item.review_count != null
        ? ` (${Number(item.review_count).toLocaleString()})`
        : '';
      left.textContent = item.rating != null ? `★ ${item.rating}${reviews}` : 'No rating';
      const right = document.createElement('span');
      right.className = 'meta';
      right.textContent = [item.eta, item.price != null ? 'from ' + money(item.price) : '']
        .filter(Boolean).join(' · ');
      row.append(left, right);
    } else {
      const left = document.createElement('span');
      left.className = 'meta';
      left.textContent = item.category || '';
      const right = document.createElement('span');
      right.className = 'price';
      right.textContent = money(item.price);
      row.append(left, right);
    }
    body.appendChild(row);
    btn.append(imgOrPh(item.image_url), body);
    btn.addEventListener('click', () => {
      if (item.kind === 'restaurant') {
        send(`Let's order from ${item.name} (id ${item.id})`);
      } else {
        send(`Add item_id ${item.id} (${item.name}) to the cart`);
      }
    });
    wrap.appendChild(btn);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function renderCart(state) {
  const cart = state.cart || [];
  const totals = state.cart_totals || {};
  const el = document.getElementById('cart');
  if (!cart.length) {
    el.innerHTML = 'Empty';
    return;
  }
  const lines = cart.map(l => {
    const row = document.createElement('div');
    row.className = 'line';
    row.appendChild(imgOrPh(l.image_url));
    const mid = document.createElement('div');
    mid.innerHTML = `<div>${escapeHtml(l.name)}</div><div class="meta">${l.qty} × ${money(l.price)}</div>`;
    const tot = document.createElement('div');
    tot.className = 'price';
    tot.textContent = money(typeof l.price === 'number' ? l.price * l.qty : null);
    row.append(mid, tot);
    return row.outerHTML;
  }).join('');

  const summary = state.order_summary || {};
  const sub = totals.subtotal ?? summary.subtotal;
  const del = totals.delivery_fee ?? summary.delivery_fee;
  const plat = totals.platform_fee ?? summary.platform_fee;
  const total = totals.total ?? summary.total;
  const note = totals.fee_note || summary.notes || '';
  const mov = totals.below_minimum_order
    ? `<div class="fee-note">Items are under the typical Rs. ${totals.minimum_order} vendor minimum. Foodpanda may add a small-order fee at checkout.</div>`
    : '';

  el.innerHTML = lines + `
    <div class="totals">
      <div class="kv"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="kv"><span>Delivery fee</span><span>${money(del)}</span></div>
      <div class="kv"><span>Platform fee</span><span>${money(plat)}</span></div>
      <div class="kv pay"><span>Total</span><span>${money(total)}</span></div>
    </div>
    ${mov}
    <div class="fee-note">${escapeHtml(note)}</div>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderState(state) {
  const rows = [
    ['Location', state.location],
    ['Party size', state.party_size],
    ['Craving', state.craving],
    ['Budget', typeof state.budget === 'number' ? money(state.budget) : state.budget],
    ['Restaurant', state.restaurant_name || (state.restaurant_id ? '#' + state.restaurant_id : null)],
  ];
  document.getElementById('prefs').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><span>${k}</span><span>${v === null || v === undefined || v === '' ? '—' : String(v)}</span></div>`
  ).join('');
  renderCart(state);
  renderShowcase(state.showcase);
}

async function send(message) {
  await unlockSpeech();
  stopSpeech();
  addMessage(message, 'user');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'thinking…';
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;
  sendBtn.disabled = true;

  try {
    const streamed = await sendStream(message, typing);
    if (streamed) return;
    const res = await api('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message})
    });
    typing.remove();
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      addMessage('Error: server returned non-JSON (' + res.status + '): ' + text.slice(0, 180), 'err');
      return;
    }
    if (!res.ok) {
      const detail = data.detail;
      const msg = typeof detail === 'string' ? detail : (detail ? JSON.stringify(detail) : res.status);
      addMessage('Error: ' + msg, 'err');
      return;
    }
    addMessage(data.reply || '(no reply)', data.busy ? 'busy' : 'bot');
    renderState(data.state || {});
    if (!speechMuted && data.reply && !data.busy) speakReply(data.reply);
  } catch (err) {
    typing.remove();
    addMessage('Network error: ' + err.message, 'err');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

async function sendStream(message, typing) {
  const res = await api('/chat/stream', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Accept': 'text/event-stream'},
    body: JSON.stringify({session_id: sessionId, message})
  });
  if (!res.ok || !res.body) return false;
  const ctype = res.headers.get('content-type') || '';
  if (!ctype.includes('text/event-stream') && !ctype.includes('json')) {
    return false;
  }
  if (!ctype.includes('text/event-stream')) return false;

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let bot = null;
  let finalReply = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    const parts = buf.split('\n\n');
    buf = parts.pop() || '';
    for (const part of parts) {
      const raw = part.split('\n')
        .filter((l) => l.startsWith('data:'))
        .map((l) => l.slice(5).trim())
        .join('');
      if (!raw) continue;
      let ev;
      try { ev = JSON.parse(raw); } catch { continue; }
      if (ev.token) {
        if (typing.parentNode) typing.remove();
        if (!bot) bot = addMessage('', 'bot');
        bot.textContent += ev.token;
        log.scrollTop = log.scrollHeight;
      }
      if (ev.error) {
        typing.remove();
        addMessage('Error: ' + ev.error, 'err');
        return true;
      }
      if (ev.done) {
        typing.remove();
        finalReply = ev.reply || (bot && bot.textContent) || '';
        if (ev.busy) {
          if (bot) bot.remove();
          addMessage(finalReply || 'System busy, please try again.', 'busy');
        } else if (!bot) {
          addMessage(finalReply || '(no reply)', 'bot');
        } else if (ev.reply) {
          bot.textContent = ev.reply;
        }
        renderState(ev.state || {});
        if (!speechMuted && finalReply && !ev.busy) speakReply(finalReply);
      }
    }
  }
  return true;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

function stopSpeech() {
  speakGen += 1;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.removeAttribute('src');
    currentAudio.load();
    currentAudio = null;
  }
  speechEl.pause();
}

async function unlockSpeech() {
  if (speechUnlocked) return;
  try {
    speechEl.muted = true;
    speechEl.src = SILENCE_WAV;
    await speechEl.play();
    speechEl.pause();
    speechEl.removeAttribute('src');
    speechEl.load();
    speechEl.muted = false;
    speechUnlocked = true;
  } catch {
    speechEl.muted = false;
  }
}

function speakWithBrowser(text, gen) {
  if (!window.speechSynthesis || speechMuted || gen !== speakGen) return;
  if (!ttsFallbackNoted) {
    ttsFallbackNoted = true;
    addMessage(
      'Using the browser voice for now. To enable Groq Orpheus, accept the model terms at https://console.groq.com/playground?model=canopylabs%2Forpheus-v1-english then refresh.',
      'err'
    );
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  utter.onend = () => {};
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

async function speakReply(text) {
  if (speechMuted || !text) return;
  const gen = ++speakGen;
  try {
    const res = await api('/voice/speak', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    if (gen !== speakGen || speechMuted) return;
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      console.warn('TTS failed', errBody.detail || res.status);
      speakWithBrowser(text, gen);
      return;
    }
    const latency = res.headers.get('X-TTS-Latency-Ms');
    const chunks = res.headers.get('X-TTS-Chunks');
    console.log('TTS ' + latency + 'ms chunks=' + chunks);
    const raw = await res.blob();
    if (gen !== speakGen || speechMuted) return;
    const blob = new Blob([raw], {type: 'audio/wav'});
    const url = URL.createObjectURL(blob);
    speechEl.src = url;
    currentAudio = speechEl;
    speechEl.onended = () => {
      URL.revokeObjectURL(url);
      if (currentAudio === speechEl) currentAudio = null;
    };
    try {
      await speechEl.play();
    } catch (err) {
      console.warn('TTS play blocked', err);
      speakWithBrowser(text, gen);
    }
  } catch (err) {
    console.warn('TTS error', err);
    speakWithBrowser(text, gen);
  }
}

function resetMicButton() {
  transcribing = false;
  micBtn.disabled = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = 'Mic';
  micBtn.title = 'Click to talk';
}

async function transcribeBlob(blob, filename, opts) {
  const live = !!(opts && opts.live);
  if (!blob || blob.size < (live ? 1500 : 200)) {
    if (!live && !input.value.trim()) {
      resetMicButton();
      addMessage('Recording too short — click Mic, speak, then click again to stop.', 'err');
    }
    return false;
  }
  const seq = ++liveSeq;
  if (!live) {
    transcribing = true;
    micBtn.disabled = true;
    micBtn.textContent = '…';
  }
  const fd = new FormData();
  fd.append('audio', blob, filename || 'speech.webm');
  try {
    const res = await api('/voice/transcribe', {method: 'POST', body: fd});
    const data = await res.json().catch(() => ({}));
    if (seq !== liveSeq) return false;
    if (!res.ok) {
      if (!live) addMessage('Transcribe failed: ' + (data.detail || res.status), 'err');
      return false;
    }
    if (data.text) {
      input.value = data.text;
      console.log((live ? 'STT live ' : 'STT ') + data.latency_ms + 'ms', data.text);
    }
    return true;
  } catch (err) {
    if (!live) addMessage('Transcribe error: ' + err.message, 'err');
    return false;
  } finally {
    if (!live && seq === liveSeq) resetMicButton();
  }
}

async function transcribeLive() {
  if (!recording || liveInFlight) {
    liveDirty = true;
    return;
  }
  liveInFlight = true;
  liveDirty = false;
  try {
    const packed = blobForUpload(recordChunks, recorderMime);
    await transcribeBlob(packed.blob, packed.filename, {live: true});
  } finally {
    liveInFlight = false;
    if (recording && liveDirty) transcribeLive();
  }
}

function stopLiveLoop() {
  if (liveTimer) {
    clearInterval(liveTimer);
    liveTimer = null;
  }
  if (liveKick) {
    clearTimeout(liveKick);
    liveKick = null;
  }
  liveDirty = false;
  liveSeq += 1;
}

function pickRecorderMime() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
  ];
  for (const type of candidates) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

function blobForUpload(chunks, mime) {
  const raw = (mime || 'audio/webm').split(';')[0].toLowerCase();
  let type = 'audio/webm';
  let filename = 'speech.webm';
  if (raw.includes('wav')) { type = 'audio/wav'; filename = 'speech.wav'; }
  else if (raw.includes('mp4') || raw.includes('m4a')) { type = 'audio/mp4'; filename = 'speech.m4a'; }
  else if (raw.includes('ogg')) { type = 'audio/ogg'; filename = 'speech.ogg'; }
  return {blob: new Blob(chunks, {type}), filename};
}

async function startRecording() {
  if (recording || transcribing) return;
  await unlockSpeech();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (err) {
    addMessage('Mic permission denied: ' + err.message, 'err');
    return;
  }
  const mime = pickRecorderMime();
  try {
    mediaRecorder = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
  } catch (err) {
    stream.getTracks().forEach(t => t.stop());
    addMessage('Recording not supported in this browser.', 'err');
    return;
  }
  activeStream = stream;
  recorderMime = mediaRecorder.mimeType || mime || 'audio/webm';
  recordChunks = [];
  liveInFlight = false;
  liveDirty = false;
  mediaRecorder.ondataavailable = ev => { if (ev.data && ev.data.size) recordChunks.push(ev.data); };
  mediaRecorder.onstop = async () => {
    stopLiveLoop();
    if (activeStream) {
      activeStream.getTracks().forEach(t => t.stop());
      activeStream = null;
    }
    const mimeType = recorderMime;
    mediaRecorder = null;
    const packed = blobForUpload(recordChunks, mimeType);
    await transcribeBlob(packed.blob, packed.filename);
    input.focus();
  };
  mediaRecorder.onerror = ev => {
    addMessage('Recording error: ' + (ev.error && ev.error.message ? ev.error.message : 'unknown'), 'err');
    stopRecording();
  };
  try {
    mediaRecorder.start(250);
  } catch (err) {
    stream.getTracks().forEach(t => t.stop());
    mediaRecorder = null;
    addMessage('Could not start the microphone: ' + err.message, 'err');
    return;
  }
  recording = true;
  recordStartedAt = Date.now();
  micBtn.classList.add('recording');
  micBtn.textContent = 'Stop';
  micBtn.title = 'Click to stop';
  input.placeholder = 'Listening…';
  liveTimer = setInterval(transcribeLive, 1200);
  liveKick = setTimeout(transcribeLive, 700);
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  stopLiveLoop();
  input.placeholder = 'e.g. Saddar — 5 of us, burgers and pizza';
  micBtn.classList.remove('recording');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  } else if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
    resetMicButton();
  }
}

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
  micBtn.disabled = true;
  micBtn.title = 'Voice input is not supported in this browser';
} else {
  micBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    if (recording) {
      if (Date.now() - recordStartedAt < 400) return;
      stopRecording();
      return;
    }
    if (transcribing) return;
    await startRecording();
  });
}

muteBtn.addEventListener('click', () => {
  speechMuted = !speechMuted;
  muteBtn.textContent = speechMuted ? 'Unmute' : 'Mute';
  muteBtn.classList.toggle('muted', speechMuted);
  if (speechMuted) stopSpeech();
});

stopBtn.addEventListener('click', stopSpeech);

document.getElementById('confirm').addEventListener('click', async () => {
  const res = await api(`/sessions/${sessionId}/confirm`, {method: 'POST'});
  const data = await res.json();
  if (!res.ok) {
    addMessage('Confirm failed: ' + (data.detail || res.status), 'err');
    return;
  }
  renderState({
    ...{
      location: null, party_size: null, craving: null, budget: null,
      restaurant_name: data.restaurant && data.restaurant.name,
      restaurant_id: data.restaurant && data.restaurant.id,
      cart: (data.items || []).map(i => ({...i, price: i.price, qty: i.qty, image_url: i.image_url})),
      cart_totals: {
        subtotal: data.subtotal,
        delivery_fee: data.delivery_fee,
        platform_fee: data.platform_fee,
        total: data.total,
        fee_note: data.notes,
        below_minimum_order: data.below_minimum_order,
        minimum_order: data.minimum_order,
      },
      order_summary: data,
    }
  });
  addMessage('Cart summary ready (not a real Foodpanda order). Check the totals on the right.', 'bot');
});

document.getElementById('reset').addEventListener('click', () => {
  stopSpeech();
  sessionId = newSessionId();
  startSession();
});

function showBootStatus(text) {
  const el = document.createElement('div');
  el.className = 'typing';
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function requestBrowserLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }
    let done = false;
    const finish = (value) => {
      if (done) return;
      done = true;
      resolve(value);
    };
    const timer = setTimeout(() => finish(null), 5000);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timer);
        finish({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      () => {
        clearTimeout(timer);
        finish(null);
      },
      { enableHighAccuracy: false, timeout: 5000, maximumAge: 120000 }
    );
  });
}

async function startSession() {
  lastShowcaseKey = '';
  log.innerHTML = '';
  renderState({});
  const status = showBootStatus('Finding your area…');
  try {
    const coords = await requestBrowserLocation();
    if (coords) {
      const locRes = await api(`/sessions/${sessionId}/location`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(coords),
      });
      const loc = await locRes.json().catch(() => ({}));
      if (loc.location) renderState(loc.state || { location: loc.location });
    }
    const res = await api(`/sessions/${sessionId}/welcome`, { method: 'POST' });
    const data = await res.json();
    status.remove();
    if (!res.ok) throw new Error(data.detail || res.status);
    addMessage(data.reply || 'Hey! What are you in the mood for?', 'bot');
    renderState(data.state || {});
  } catch (err) {
    status.remove();
    addMessage(
      "Hey! What are you in the mood for today, and which area of Karachi should I search near?",
      'bot'
    );
  }
  input.focus();
}

(async () => {
  renderState({});
  try {
    const res = await fetch('/health');
    const h = await res.json();
    document.getElementById('health').className = 'dot ' + (h.ok ? 'ok' : 'bad');
    document.getElementById('model').textContent = h.ok
      ? `${h.model} · ${h.database.restaurants} restaurants`
      : 'not ready — see /health';
  } catch {
    document.getElementById('model').textContent = 'API unreachable';
  }
  await startSession();
})();
